# Builds docs/ and deploys it to the Cloudflare Pages project behind docs.priompt.com.
# Cloudflare's Git integration for this repo only builds the Next.js site, so the docs need their own deploy.
# Needs the CLOUDFLARE_API_TOKEN secret: a token with Account > Cloudflare Pages > Edit.
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, pnpm-lock.yaml, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: npx -y wrangler@4.40.0 pages deploy docs/build --project-name priompt-docs --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bac792974fa1d70866babff1a6402626
